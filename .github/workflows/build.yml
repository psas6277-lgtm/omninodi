name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Find project (unzip if needed)
        run: |
          for z in ./*.zip; do
            if [ -e "$z" ]; then unzip -q -o "$z"; fi
          done
          S=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then
            echo "Gradle project not found. Files in repo:"
            ls -la
            exit 1
          fi
          echo "ROOT=$(dirname "$S")" >> $GITHUB_ENV

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: |
          cd "$ROOT"
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/OmniNode.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OmniNode-apk
          path: OmniNode.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OmniNode.apk
